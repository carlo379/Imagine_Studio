<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previz</title>
<style>
  :root { --bg:#0e1017; --panel:#171a24; --ink:#e8eaf2; --dim:#8b91a8; --accent:#ffd84a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px -apple-system, Helvetica, Arial, sans-serif; display:flex; flex-direction:column; min-height:100vh; }
  header { padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--panel); border-bottom:1px solid #262a3a; }
  header h1 { font-size:15px; margin:0 8px 0 0; font-weight:600; }
  button, input[type=file]::file-selector-button { background:#262a3a; color:var(--ink); border:0; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#31364b; }
  main { flex:1; display:flex; gap:16px; padding:16px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  #stage canvas { max-height:78vh; max-width:100%; height:auto; width:auto; border-radius:8px; background:#000; }
  #side { width:300px; max-width:100%; }
  #shots { max-height:70vh; overflow:auto; }
  .shot { padding:6px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; color:var(--dim); }
  .shot.on { background:#262a3a; color:var(--ink); }
  input[type=range] { flex:1; min-width:200px; accent-color:var(--accent); }
  #msg { color:var(--dim); }
  .hint { color:var(--dim); font-size:13px; max-width:60ch; }
</style>
</head>
<body>
<header>
  <h1>Previz</h1>
  <button id="play">Play</button>
  <button id="still" title="Save a clean PNG of this moment (no label or lyrics)">Save still</button>
  <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Time">
  <span id="clock">0.00 / 0.00 s</span>
  <label>Spec <input id="specfile" type="file" accept="application/json"></label>
  <label>Song <input id="audiofile" type="file" accept="audio/*"></label>
  <span id="msg"></span>
</header>
<main>
  <div id="stage"></div>
  <div id="side">
    <p class="hint" id="hint">Open a previz spec (JSON) and the song to preview the whole video on the real timeline. Everything is local; nothing is generated or uploaded.</p>
    <div id="shots"></div>
  </div>
</main>
<script type="module">
import { boot } from './previz.js';
const $ = (id) => document.getElementById(id);
const audio = new Audio();
let api = null, playing = false, raf = 0, t0 = 0, base = 0, useAudio = false;
const params = new URLSearchParams(location.search);

function say(text) { $('msg').textContent = text || ''; }
async function load(spec) {
  $('stage').innerHTML = '';
  try { api = await boot(spec, $('stage')); } catch (e) { say('This browser could not start WebGL: ' + e.message); return; }
  $('scrub').max = api.duration;
  $('shots').innerHTML = '';
  for (const s of api.shots) {
    const d = document.createElement('div');
    d.className = 'shot'; d.dataset.id = s.id;
    d.innerHTML = `<span>${s.id} ${s.kind || ''}</span><span>${s.start.toFixed(1)}s</span>`;
    d.onclick = () => seek(s.start);
    $('shots').appendChild(d);
  }
  seek(0);
  if (spec.audio_url) { audio.src = spec.audio_url; useAudio = true; }
  $('hint').style.display = 'none';
}
function now() { return useAudio && audio.src && !audio.paused ? audio.currentTime : base + (performance.now() - t0) / 1000; }
function seek(t) {
  if (!api) return;
  t = Math.max(0, Math.min(api.duration, t));
  base = t; t0 = performance.now();
  if (audio.src) audio.currentTime = t;
  draw(t);
}
function draw(t) {
  const id = api.setTime(t);
  $('scrub').value = t;
  $('clock').textContent = `${t.toFixed(2)} / ${api.duration.toFixed(2)} s`;
  for (const el of $('shots').children) el.classList.toggle('on', el.dataset.id === id);
}
function tick() {
  if (!playing) return;
  const t = now();
  if (t >= api.duration) { playing = false; $('play').textContent = 'Play'; audio.pause(); return; }
  draw(t);
  raf = requestAnimationFrame(tick);
}
$('play').onclick = () => {
  if (!api) return;
  playing = !playing;
  $('play').textContent = playing ? 'Pause' : 'Play';
  if (playing) { base = parseFloat($('scrub').value); t0 = performance.now(); if (audio.src) { audio.currentTime = base; audio.play().catch(() => { useAudio = false; }); } tick(); }
  else { audio.pause(); cancelAnimationFrame(raf); }
};
$('still').onclick = () => {
  if (!api) return;
  const t = parseFloat($('scrub').value), id = api.setTime(t);
  const link = document.createElement('a');
  link.href = 'data:image/png;base64,' + api.still(t);
  link.download = `${id || 'previz'}-${t.toFixed(2)}s.png`;
  link.click();
  draw(t);
  say('Still saved: composition reference for stills only, never for the video model.');
};
$('scrub').oninput = (e) => seek(parseFloat(e.target.value));
$('specfile').onchange = async (e) => { const f = e.target.files[0]; if (f) await load(JSON.parse(await f.text())); };
$('audiofile').onchange = (e) => { const f = e.target.files[0]; if (f) { audio.src = URL.createObjectURL(f); useAudio = true; say('Song loaded.'); } };
if (params.get('spec')) { fetch(params.get('spec')).then((r) => r.json()).then(load).catch((e) => say('Could not load the spec: ' + e.message)); }
window.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').click(); } });
</script>
</body>
</html>
